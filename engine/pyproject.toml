[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-rag"
version = "1.0.0"
description = "Bilingual (EN/JA) AI-powered SecOps engine: hierarchical RAG over Linux logs and threat advisories"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arron" }]
keywords = ["security", "secops", "rag", "llm", "bilingual", "japanese", "siem"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Logging",
]

# Intentionally empty: every dependency is optional and the engine degrades
# gracefully without them. See requirements.txt and the extras below.
dependencies = []

[project.optional-dependencies]
retrieval = ["chromadb>=0.5.0,<2.0.0", "sentence-transformers>=3.0.0,<6.0.0"]
llm = ["google-generativeai>=0.8.0,<2.0.0", "openai>=1.40.0,<3.0.0"]
api = ["fastapi>=0.115.0,<1.0.0", "uvicorn[standard]>=0.30.0,<1.0.0"]
dev = ["pytest>=8.0.0,<9.0.0", "pytest-cov>=5.0.0,<7.0.0", "ruff>=0.6.0,<1.0.0", "mypy>=1.11.0,<2.0.0"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:sentinel.*"]

[tool.ruff]
line-length = 118
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RET"]
ignore = [
  "E501",    # line length is handled by the formatter
  "S101",    # assert is fine in tests
  "B008",    # FastAPI's Depends() idiom
  "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
# response.py runs ufw deliberately, with an argv list and shell=False.
"sentinel/response.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Third-party packages are optional, so their stubs are frequently absent.
ignore_missing_imports = true
