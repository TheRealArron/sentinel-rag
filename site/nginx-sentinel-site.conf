# nginx site for the Sentinel RAG write-up.
#
#   sudo cp site/nginx-sentinel-site.conf /etc/nginx/sites-available/sentinel-site
#   sudo ln -sf /etc/nginx/sites-available/sentinel-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a certificate. certbot rewrites this file in place to add the TLS
# block and the :80 redirect:
#
#   sudo certbot --nginx -d sentinel.example.com
#
# This serves ONE static HTML file. It deliberately does not proxy to the
# Sentinel dashboard: the write-up is public, and the dashboard has an endpoint
# that a host-side responder turns into firewall rules. Putting the two behind
# one server name is how a public page ends up one path-traversal away from a
# root-privileged action. Keep them on separate names, or keep the dashboard off
# the public interface entirely — see docs/design/api-hardening.md.

server {
    listen 80;
    listen [::]:80;

    server_name sentinel.example.com;   # <- change this

    root /var/www/sentinel-site;
    index index.html;

    charset utf-8;

    # No PHP, no CGI, no uploads, no directory listing. The only thing this
    # server can do is return one file.
    autoindex off;
    location / {
        try_files $uri $uri/ =404;
    }

    # The page is self-contained: no external scripts, styles, fonts or images.
    # So the policy can be maximally strict, and any future edit that reaches
    # for a CDN will fail loudly here rather than silently adding a third party
    # to a page about security engineering.
    add_header Content-Security-Policy
        "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # The page is one file that changes when it is rewritten, not on a schedule.
    location = /index.html {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    access_log /var/log/nginx/sentinel-site.access.log;
    error_log  /var/log/nginx/sentinel-site.error.log;
}
