name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go ingestor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # The module has no external dependencies, so there is no go.sum to
          # key a cache on. Enable this if a dependency is ever added.
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"; echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test with the race detector
        # The pipeline fans out across goroutines and restores order in a
        # collector; -race is the only thing that reliably catches a regression
        # in that hand-off.
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o /tmp/sentinel-ingestor ./cmd/sentinel-ingestor

      - name: Compile the Sigma rules
        # Rebuilt from source rather than trusting the committed bundle, so a
        # transpiler change that emits something Go cannot read fails here rather
        # than in production. The result must match what is committed.
        working-directory: .
        run: |
          # No PyYAML installed on purpose: the transpiler carries a fallback
          # parser for the Sigma subset, and this is what keeps it honest.
          cd engine && python3 -m sentinel sigma --rules ../rules/sigma --out /tmp/sigma.json
          cd ..
          if ! diff -u <(jq -S . rules/external/sigma.json) <(jq -S . /tmp/sigma.json); then
            echo "::error::rules/external/sigma.json is stale — run 'make sigma' and commit"
            exit 1
          fi
          mkdir -p /tmp/rules && cp /tmp/sigma.json /tmp/rules/

      - name: Smoke test against the sample log
        env:
          # RFC 3164 timestamps carry no timezone, so the ingestor reads them in
          # the host's local zone. Pinning TZ keeps this output identical to the
          # committed fixture regardless of where it runs.
          TZ: UTC
        run: |
          # -honeytokens is named explicitly, not left at its default. The default
          # is resolved relative to the working directory, which is `ingestor/`
          # here, so the repo-root config would not be found and the canaries would
          # be silently unarmed. Naming it also models the production contract: an
          # explicitly-named file that is missing is a hard error, so a broken
          # canary config fails the build instead of quietly disarming.
          # -sigma="" disables imported rules. The committed fixture describes a
          # default install, so this step must not depend on them; Phase 11 gets
          # its own step below.
          /tmp/sentinel-ingestor -honeytokens=../config/honeytokens.json -sigma="" \
            -in ../data/samples/sample_syslog.log -out /tmp/events.jsonl -stats 2>/tmp/stats.txt
          cat /tmp/stats.txt
          lines=$(wc -l < /tmp/events.jsonl)
          echo "emitted $lines events"
          # 23 parsed lines + 2 correlated incidents
          [ "$lines" -eq 25 ] || { echo "::error::expected 25 events, got $lines"; exit 1; }
          grep -q correlated_brute_force /tmp/events.jsonl || { echo "::error::brute-force incident missing"; exit 1; }
          grep -q correlated_successful_login_after_bruteforce /tmp/events.jsonl || { echo "::error::compromise incident missing"; exit 1; }
          # Phase 5: the canary lines must produce exactly two score-100 events.
          # This assertion is why the -honeytokens flag above is explicit: with the
          # default path it silently found nothing and this caught it.
          honey=$(grep -c honeytoken_referenced /tmp/events.jsonl || true)
          [ "$honey" -eq 2 ] || { echo "::error::expected 2 honeytoken hits, got $honey"; exit 1; }
          # And the canaries must actually be armed, not merely absent from the log.
          # jq, not grep: -stats pretty-prints, so there is a space after the colon.
          armed=$(jq -r '.honeytokens_armed' /tmp/stats.txt)
          [ "${armed:-0}" -ge 5 ] || { echo "::error::honeytokens not armed (armed=${armed:-0})"; exit 1; }

      - name: Committed fixture matches the ingestor
        # data/samples/events.sample.jsonl is the Python suite's fixture and the
        # demo's data source. If the Go rules change, this catches the drift.
        # `ingested_at` is wall-clock and is expected to differ on every run.
        run: |
          jq -Sc 'del(.ingested_at)' ../data/samples/events.sample.jsonl > /tmp/fixture.norm
          jq -Sc 'del(.ingested_at)' /tmp/events.jsonl                   > /tmp/actual.norm
          if ! diff -u /tmp/fixture.norm /tmp/actual.norm > /tmp/fixture.diff; then
            echo "::error::the committed fixture differs from ingestor output"
            echo "::error::regenerate with 'make sample' and commit the result"
            head -60 /tmp/fixture.diff
            exit 1
          fi
          echo "fixture matches the ingestor"

      - name: Imported Sigma rules fire end to end
        env:
          TZ: UTC
        run: |
          /tmp/sentinel-ingestor -honeytokens=../config/honeytokens.json \
            -sigma=/tmp/rules \
            -in ../data/samples/sample_syslog.log -out /tmp/sigma-events.jsonl \
            -stats 2>/tmp/sigma-stats.txt
          armed=$(jq -r '.sigma_rules' /tmp/sigma-stats.txt)
          [ "${armed:-0}" -ge 3 ] || { echo "::error::sigma rules not armed (${armed:-0})"; exit 1; }
          # Loaded is not the same as working: assert events actually carry the
          # attribution. Counting only loaded rules would pass with a matcher
          # that never fires.
          attributed=$(jq -r 'select(.fields.sigma_rule != null)|.fields.sigma_rule' \
            /tmp/sigma-events.jsonl | sort -u | wc -l)
          [ "$attributed" -ge 2 ] || { echo "::error::only $attributed sigma rule(s) attributed"; exit 1; }
          # Regression guard: an imported rule must not disable correlation by
          # overwriting the outcome a built-in derived from the log line.
          grep -q correlated_brute_force /tmp/sigma-events.jsonl || {
            echo "::error::sigma import broke brute-force correlation"; exit 1; }
          [ "$(wc -l < /tmp/sigma-events.jsonl)" -eq 25 ] || {
            echo "::error::sigma import changed the event count"; exit 1; }
          echo "sigma: ${armed} rule(s) armed, ${attributed} distinct rule(s) attributed"

  python:
    name: Python engine (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the dev toolchain only
        # Deliberately NOT installing requirements.txt: the engine must pass its
        # whole test suite with zero third-party runtime dependencies. If a test
        # starts needing torch, the fallback path has quietly rotted.
        run: python -m pip install --upgrade pip pytest pytest-cov ruff

      - name: Lint
        run: ruff check engine/sentinel engine/tests

      - name: Test
        working-directory: engine
        run: python -m pytest tests/ -q --cov=sentinel --cov-report=term-missing

      - name: CLI smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: |
          python -m sentinel demo --min-score 40
          python -m sentinel stats --json > /tmp/stats.json
          python -c "import json;s=json.load(open('/tmp/stats.json'));assert s['events']['events']==25, s['events']"

      - name: Bilingual retrieval check
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: |
          python -m sentinel index
          python - <<'PY'
          from sentinel.engine import SentinelEngine
          engine = SentinelEngine()
          for query in ("SSH brute force from the internet", "SSH ブルートフォース 攻撃 対策"):
              results = engine.search(query, k=6)
              mix = engine.retriever.language_mix(results)
              print(f"{query!r} -> {mix}")
              assert mix.get("en", 0) >= 1 and mix.get("ja", 0) >= 1, f"not bilingual: {mix}"
          PY

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the ingestor image
        uses: docker/build-push-action@v6
        with:
          context: ./ingestor
          push: false
          load: true
          tags: sentinel-rag/ingestor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ingestor image runs
        run: |
          docker run --rm sentinel-rag/ingestor:ci -version
          docker run --rm -i sentinel-rag/ingestor:ci -in - -out - \
            < data/samples/sample_syslog.log | head -3

      - name: Validate the compose file
        run: docker compose config --quiet
