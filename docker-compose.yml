# Sentinel RAG — home server deployment.
#
#   cp .env.example .env      # add your Gemini key
#   docker compose up --build -d
#   xdg-open http://127.0.0.1:8000/
#
# Two services, isolated on purpose. The Go ingestor is the only thing that reads
# host logs, and it is the only thing with access to /var/log — read-only, in a
# scratch container, as a non-root user. The Python engine never sees the host
# filesystem; it reads the ingestor's JSONL through a shared named volume. A
# compromise of the AI engine (the component with a network listener, an LLM API
# client, and by far the most code) therefore cannot read your logs directly,
# cannot write to /var/log, and cannot reach the firewall.

name: sentinel-rag

services:
  # ---------------------------------------------------------------- ingestor
  ingestor:
    build:
      context: ./ingestor
      args:
        VERSION: ${SENTINEL_VERSION:-dev}
    image: sentinel-rag/ingestor:${SENTINEL_VERSION:-dev}
    container_name: sentinel-ingestor
    restart: unless-stopped
    command:
      - "-in=/hostlogs/auth.log"
      - "-out=/data/events.jsonl"
      - "-follow"
      - "-min-score=${SENTINEL_MIN_SCORE:-0}"
      - "-brute-threshold=${SENTINEL_BRUTE_THRESHOLD:-5}"
      - "-brute-window=${SENTINEL_BRUTE_WINDOW:-1m}"
      - "-honeytokens=/config/honeytokens.json"
      - "-stats"
    volumes:
      # Host logs, read-only. The ingestor never needs to write here, and :ro
      # means a bug in it cannot destroy the evidence it is reading.
      - /var/log/auth.log:/hostlogs/auth.log:ro
      - /var/log/syslog:/hostlogs/syslog:ro
      # Canary config, read-only. Bind-mounted rather than baked in so tokens can
      # be rotated without a rebuild. Named explicitly in the command above, so a
      # missing file is a startup error rather than silently unarmed canaries.
      - ./config:/config:ro
      - sentinel-data:/data
    # Everything a log parser needs and nothing else.
    read_only: true
    cap_drop: ["ALL"]
    # Layered confinement. cap_drop and read_only bound what the container may
    # do; these two bound what it may touch and which syscalls it may make.
    # AppArmor carries the path policy (seccomp cannot express "read /var/log but
    # not /etc/shadow"); seccomp denies syscalls a log parser never needs.
    # Load the AppArmor profile first:
    #   sudo apparmor_parser -r -W security/apparmor-sentinel-ingestor
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./security/seccomp-sentinel-ingestor.json"
      # - "apparmor=sentinel-ingestor"   # uncomment once the profile is loaded
    # No network at all: the ingestor reads a file and writes a file.
    network_mode: none
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { memory: 128M, cpus: "1.0" }

  # ------------------------------------------------------------------ engine
  engine:
    build:
      context: ./engine
    image: sentinel-rag/engine:${SENTINEL_VERSION:-dev}
    container_name: sentinel-engine
    restart: unless-stopped
    depends_on: [ingestor]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SENTINEL_LLM_PROVIDER: ${SENTINEL_LLM_PROVIDER:-auto}
      SENTINEL_LLM_MODEL: ${SENTINEL_LLM_MODEL:-gemini-2.0-flash}
      SENTINEL_EMBEDDING_MODEL: ${SENTINEL_EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      SENTINEL_EMBEDDING_BACKEND: ${SENTINEL_EMBEDDING_BACKEND:-auto}
      SENTINEL_VECTOR_BACKEND: ${SENTINEL_VECTOR_BACKEND:-auto}
      SENTINEL_ANONYMIZE: ${SENTINEL_ANONYMIZE:-1}
      # Phase 7. host.docker.internal reaches an Ollama running on the host;
      # add `extra_hosts: ["host.docker.internal:host-gateway"]` on Linux, or
      # point this at a sibling container.
      SENTINEL_LOCAL_BACKEND: ${SENTINEL_LOCAL_BACKEND:-none}
      SENTINEL_LOCAL_BASE_URL: ${SENTINEL_LOCAL_BASE_URL:-http://host.docker.internal:11434}
      SENTINEL_LOCAL_MODEL: ${SENTINEL_LOCAL_MODEL:-qwen2.5:7b}
      SENTINEL_LOCAL_TIMEOUT: ${SENTINEL_LOCAL_TIMEOUT:-180}
      SENTINEL_LLM_FALLBACK: ${SENTINEL_LLM_FALLBACK:-none}
      SENTINEL_AIR_GAP: ${SENTINEL_AIR_GAP:-0}
      SENTINEL_API_TOKEN: ${SENTINEL_API_TOKEN:-}
      # Active response cannot work from inside this container by design — see
      # the note below and scripts/sentinel-responder.sh.
      SENTINEL_RESPONSE_MODE: ${SENTINEL_RESPONSE_MODE:-dry-run}
    volumes:
      - sentinel-data:/data
      # Advisories are bind-mounted rather than baked in, so you can drop a new
      # JPCERT or NVD document in and re-index without rebuilding the image.
      - ./data/advisories:/app/data/advisories:ro
    ports:
      # Bound to localhost. This dashboard shows your security posture and can
      # trigger firewall changes; exposing it on 0.0.0.0 would put it on your
      # LAN. Put it behind a reverse proxy with TLS and auth if you need remote
      # access, and set SENTINEL_API_TOKEN.
      - "127.0.0.1:${SENTINEL_API_PORT:-8000}:8000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Reaches an Ollama running on the host. Harmless when SENTINEL_LOCAL_BACKEND
    # is none, and required for Phase 7 on Linux, where host.docker.internal is
    # not resolvable by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        # multilingual-e5-large needs roughly 2.5 GB resident during inference.
        # Lower this to 1G and switch to multilingual-e5-small if your server is
        # tight on memory.
        #
        # Quoted deliberately: in YAML flow style the closing brace of
        # ${VAR:-default} is parsed as the end of the mapping, so the unquoted
        # form is a syntax error rather than a substitution.
        limits: { memory: "${SENTINEL_MEMORY_LIMIT:-4G}" }

volumes:
  sentinel-data:
    driver: local

# ---------------------------------------------------------------------------
# A note on Phase 4 (active response)
#
# Nothing here grants the engine NET_ADMIN or mounts the Docker socket, and that
# is intentional. Giving a container that talks to an LLM the ability to rewrite
# the host firewall is a straight line from prompt injection to lockout.
#
# The supported pattern is to run the responder on the host, reading the audit
# log the engine writes:
#
#     sudo cp scripts/sentinel-responder.sh /usr/local/bin/
#     sudo systemctl enable --now sentinel-responder.timer
#
# That keeps the privileged action on the host, under systemd, with its own
# allowlist — so the blast radius of a compromised engine stops at "writes a
# suggestion nobody has to take".
# ---------------------------------------------------------------------------
